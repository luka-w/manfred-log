<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Manfred — a humanoid robot. Hardware, software and project journal.">
  <title>Manfred</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header><h1>Manfred</h1></header>
  <main id="main">
    <div class="stack-grid">
      <section aria-labelledby="hardware-title"><h2 id="hardware-title">Hardware</h2><ul id="hardware"><li>Details coming soon.</li></ul></section>
      <section aria-labelledby="software-title"><h2 id="software-title">Software</h2><ul id="software"><li>Details coming soon.</li></ul></section>
    </div>
    <section id="journal" aria-labelledby="journal-title">
      <div class="section-head"><h2 id="journal-title">Journal</h2><span id="count"></span></div>
      <div id="entries"><p class="empty">No posts yet.</p></div>
      <p id="error" hidden role="status">Unable to load content. Refresh the page.</p>
      <noscript><p>Enable JavaScript to view posts and the stack.</p></noscript>
    </section>
  </main>
</body>
</html>
